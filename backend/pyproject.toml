[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal API: drafts legal agreements from Common Paper templates."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.121.0",
    "httpx2>=2.12.0",
    "pydantic-settings>=2.8.0",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
